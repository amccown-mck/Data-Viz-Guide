<section class="scene bg-deep" id="s-open" data-min="22">
  <!-- u = narrAt (.6) + cue. c0 .60 "Picture a leadership meeting." · c1 2.65 "A chart goes up." · c2 4.72 "Twelve colors. Two axes. ... Chart Title."
       c3 10.19 "So the first question isn't 'what should we do?'" · c4 13.16 "It's 'what am I looking at?'"
       c5 15.86 "Ten minutes later, the room is still decoding the chart." · c6 19.53 "And the decision waits." -->

  <!-- the room: a presentation screen, a conference table, six seated figures seen from behind -->
  <div class="mt-screen a" style="--k:fade;--t:0s;--d:.5s;left:360px;top:50px;width:1200px;height:680px">
    <img class="mt-chart a" data-sfx="thunk" src="assets/meet_bad.png" alt="" style="--k:fade;--t:2.65s;--d:.06s">
    <p class="sticker mt-call a" data-sfx="pop" style="--k:stamp;--t:4.85s;--d:.4s;left:70px;top:150px;rotate:-6deg">12 colors</p>
    <p class="sticker mt-call a" data-sfx="pop" data-sfx-semi="3" style="--k:stamp;--t:5.75s;--d:.4s;left:860px;top:300px;rotate:4deg">2 axes</p>
    <p class="sticker navy mt-call a" data-sfx="thunk" style="--k:stamp;--t:8.55s;--d:.4s;left:250px;top:14px;rotate:-2deg">“Chart Title”</p>
  </div>
  <div class="mt-table a" style="--k:fade;--t:0s;--d:.5s"></div>
  <div class="mt-people a" style="--k:up;--t:.1s;--d:.5s">
    <div class="mt-p" style="left:300px"></div><div class="mt-p" style="left:530px"></div><div class="mt-p" style="left:760px"></div>
    <div class="mt-p" style="left:990px"></div><div class="mt-p" style="left:1220px"></div><div class="mt-p" style="left:1450px"></div>
  </div>

  <!-- c0: the caption, over the dark screen, out when the chart goes up -->
  <h2 class="cap inv a x" data-sfx="whoosh" style="--k:slam;--t:.6s;--d:.45s;--t2:2.65s;--k2:xcut;--d2:.01s;left:80px;top:300px;width:1760px">Picture a leadership&nbsp;meeting.</h2>

  <!-- c3: the question that should have been asked, crossed out -->
  <div class="mt-bub a" data-sfx="pop" style="--k:pop;--t:10.19s;--d:.35s;left:360px;top:700px"><span>What should we do?</span><i class="mt-strike"></i></div>
  <!-- c4: the question that is asked (hold) -->
  <div class="mt-bub a" data-sfx="pop" data-sfx-semi="-2" style="--k:pop;--t:13.16s;--d:.35s;left:880px;top:650px"><span>What am I looking at?</span></div>
  <!-- c5: the timer, and another question -->
  <div class="mt-timer a" data-sfx="ticktock" style="--k:pop;--t:15.86s;--d:.35s;left:1620px;top:60px"><i></i><b class="mt-time">0:00</b></div>
  <div class="mt-bub a" data-sfx="pop" data-sfx-semi="2" style="--k:pop;--t:17.1s;--d:.35s;left:1410px;top:700px"><span>Which line is us?</span></div>
  <!-- c6: the decision waits -->
  <p class="sticker mt-dec a" data-sfx="trombone" style="--k:slam;--t:19.53s;--d:.45s;left:560px;top:840px;rotate:-3deg">Decision: waiting ⏳</p>
</section>
<style>
  #s-open .mt-screen{background:#0b1626;border:14px solid #1f2a3a;box-shadow:0 0 0 2px #0a0f18,0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  #s-open .mt-chart{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#fff}
  #s-open .mt-call{position:absolute;font-size:44px;z-index:2}
  #s-open .mt-table{position:absolute;left:160px;top:790px;width:1600px;height:360px;background:#1b2b45;border-radius:48px 48px 0 0;box-shadow:inset 0 10px 0 rgba(255,255,255,.06)}
  #s-open .mt-people{position:absolute;left:0;top:0;width:1920px;height:1080px}
  #s-open .mt-p{position:absolute;top:905px;width:170px;height:200px;background:#3a4a63;border-radius:60px 60px 0 0}
  #s-open .mt-p::before{content:"";position:absolute;left:41px;top:-78px;width:88px;height:88px;border-radius:50%;background:#4a5b78}
  #s-open .mt-p:nth-child(2n){background:#2e3d57}#s-open .mt-p:nth-child(2n)::before{background:#3d4e6a}
  #s-open .mt-p:nth-child(3n){background:#55657f}#s-open .mt-p:nth-child(3n)::before{background:#66789a}
  #s-open .mt-bub{position:absolute;background:#fff;color:var(--navy);font-weight:600;font-size:44px;line-height:1.1;padding:22px 34px 26px;border-radius:22px;white-space:nowrap;box-shadow:0 14px 36px rgba(0,0,0,.35);z-index:3}
  #s-open .mt-bub::after{content:"";position:absolute;left:70px;bottom:-26px;border:14px solid transparent;border-top:18px solid #fff;border-bottom:0}
  #s-open .mt-bub span{position:relative;display:inline-block}
  #s-open .mt-strike{position:absolute;left:28px;right:28px;top:50%;height:7px;margin-top:-3px;background:var(--mck-orange,#E07B39);border-radius:4px;transform:scaleX(0);transform-origin:left center;opacity:0}
  #s-open.on .mt-strike{animation:mt-strike .35s ease-out 11.7s forwards}
  @keyframes mt-strike{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:1}}
  #s-open .mt-timer{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;color:var(--navy);border-radius:60px;padding:12px 28px 12px 20px;box-shadow:0 14px 36px rgba(0,0,0,.35)}
  #s-open .mt-timer i{width:26px;height:26px;border-radius:50%;background:var(--mck-orange,#E07B39);box-shadow:0 0 0 6px rgba(224,123,57,.25)}
  #s-open .mt-timer b{font-family:Mono,monospace;font-size:54px;font-weight:700;letter-spacing:.02em;min-width:150px;text-align:right}
  #s-open .mt-dec{font-size:72px;z-index:4}
</style>
<script>
SCENES["s-open"] = {
  narrAt: .6,
  clock: () => null,
  sfx: [],
  frame(u) {
    const el = document.querySelector("#s-open .mt-time"); if (!el) return;
    const T0 = 15.86, T1 = 19.1;                          // the clock runs 0:00 -> 10:00 across chunk 5
    const f = Math.max(0, Math.min(1, (u - T0) / (T1 - T0)));
    const s = Math.round(f * 600);
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  },
};
</script>
