<script>
// =====================================================================================
// Shared helpers for scenes
// =====================================================================================
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const SPARK_GLYPH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5c.9 6.4 3.9 9.6 10.5 10.5-6.6.9-9.6 4.1-10.5 10.5C11.1 16.1 8.1 12.9 1.5 12 8.1 11.1 11.1 7.9 12 1.5z"/></svg>';
function pyHL(code) {
  const re = /(#.*$)|(f?"(?:[^"\\]|\\.)*")|\b(import|as|for|in|if|from|def|return|None|True|False)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)(?=\()/g;
  return code.split("\n").map(line => {
    let out = "", last = 0, m; re.lastIndex = 0;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));
      const c = m[1] ? "tk-c" : m[2] ? "tk-s" : m[3] ? "tk-k" : m[4] ? "tk-n" : "tk-f";
      out += `<span class="${c}">${esc(m[0])}</span>`; last = re.lastIndex;
    }
    return out + esc(line.slice(last));
  }).join("\n");
}
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim().toUpperCase();
const H = (h, m) => h * 60 + m;
const safe = (f, ...a) => { try { return f?.(...a); } catch (e) { console.warn(e); } };
document.querySelectorAll(".av.claude").forEach(e => { if (!e.innerHTML.trim()) e.innerHTML = SPARK_GLYPH; });
document.querySelectorAll(".type").forEach(e => e.style.setProperty("--n", e.textContent.length));

// =====================================================================================
// Audio: synthesized music + sound effects, and the narration clips
// =====================================================================================
const NBUF = {};
let A = null;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const MIX = {music: true, sfx: true, narr: true};
function makeBus(ctx, dest, realtime) {
  const b = {ctx, active: realtime ? new Set() : null};
  b.master = ctx.createGain(); b.master.gain.value = .9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  comp.connect(b.master); b.master.connect(dest);
  if (realtime && ctx.createMediaStreamDestination) { b.rec = ctx.createMediaStreamDestination(); b.master.connect(b.rec); }
  b.musicLvl = ctx.createGain(); b.musicLvl.connect(comp);
  b.music = ctx.createGain(); b.music.connect(b.musicLvl);
  b.sfxLvl = ctx.createGain(); b.sfxLvl.connect(comp); b.sfx = b.sfxLvl;
  b.narr = ctx.createGain(); b.narr.connect(comp);
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  b.noise = nb; musicDesk(b); setLevels(b); return b;
}
function setLevels(b) {
  b.musicLvl.gain.value = MIX.music ? (MIX.narr ? .5 : .75) : 0;
  b.sfxLvl.gain.value = MIX.sfx ? .55 : 0;
  b.narr.gain.value = MIX.narr ? 1 : 0;
}
function reg(b, n) { if (b.active) { b.active.add(n); n.onended = () => b.active.delete(n); } return n; }
function osc(b, type, f, when, dur) { const o = b.ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, when); o.start(when); o.stop(when + dur); return reg(b, o); }
function env(b, when, peak, attack, decay, out) {
  const g = b.ctx.createGain(); g.gain.setValueAtTime(.0001, when);
  g.gain.exponentialRampToValueAtTime(peak, when + attack); g.gain.exponentialRampToValueAtTime(.0001, when + attack + decay);
  g.connect(out); return g;
}
function noise(b, when, dur) { const s = b.ctx.createBufferSource(); s.buffer = b.noise; s.loop = true; s.start(when); s.stop(when + dur); return reg(b, s); }
function filt(b, type, f, q = .8) { const x = b.ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
// ---- the music desk: instrument channels → section level → master filter → b.music (ducked under the voice)
function musicDesk(b) {
  const ctx = b.ctx;
  b.mfilt = filt(b, "lowpass", 20000, .5); b.mfilt.connect(b.music);
  b.secg = ctx.createGain(); b.secg.connect(b.mfilt);
  // reverb: a generated hall impulse
  const len = Math.floor(ctx.sampleRate * 2.6), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  b.verb = ctx.createConvolver(); b.verb.buffer = ir; const vr = ctx.createGain(); vr.gain.value = .55; b.verb.connect(vr); vr.connect(b.secg);
  // echo: dotted eighths, darkening as it repeats
  b.dly = ctx.createDelay(1); b.dly.delayTime.value = STEP * 1.5; const fb = ctx.createGain(); fb.gain.value = .32;
  const dlp = filt(b, "lowpass", 2600); b.dly.connect(dlp); dlp.connect(fb); fb.connect(b.dly); const dr = ctx.createGain(); dr.gain.value = .5; dlp.connect(dr); dr.connect(b.secg);

  b.pump = ctx.createGain(); b.pump.connect(b.secg);
  const ch = (pan, verb, dly, to = b.secg) => {
    const g = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(to);
    if (verb) { const s = ctx.createGain(); s.gain.value = verb; p.connect(s); s.connect(b.verb); }
    if (dly) { const s = ctx.createGain(); s.gain.value = dly; p.connect(s); s.connect(b.dly); }
    return g;
  };
  b.ch = {keys: ch(-.18, .28, 0), pluck: ch(.22, .2, .18), pad: ch(0, .35, 0, b.pump), str: ch(.12, .45, 0), bass: ch(0, 0, 0),
          drums: ch(0, .07, 0), lead: ch(.08, .3, .3), bell: ch(-.28, .45, .25)};
}
// a gain with attack / decay-to-sustain / release (robust for any note length)
function adsr(b, w, v, a, dcy, sus, d, rel, dest) {
  const g = b.ctx.createGain(), p = g.gain; p.setValueAtTime(0, w); p.linearRampToValueAtTime(v, w + a);
  p.setTargetAtTime(v * sus, w + a, dcy / 3); p.setTargetAtTime(0, w + Math.max(d, a + .01), rel / 3); g.connect(dest); return g;
}
// instruments (m = midi note, w = when, d = length in s, v = velocity)
function ep(b, m, w, d, v) {                       // electric piano (FM)
  const f = mtof(m), g = adsr(b, w, v, .005, .9, .25, d, .5, b.ch.keys), end = w + d + .8;
  const c = osc(b, "sine", f, w, end - w), mod = osc(b, "sine", f, w, end - w), mg = b.ctx.createGain();
  mg.gain.setValueAtTime(f * 1.3, w); mg.gain.exponentialRampToValueAtTime(f * .12, w + .7); mod.connect(mg); mg.connect(c.frequency); c.connect(g);
}
function piano(b, m, w, d, v) {
  const f = mtof(m), lp = filt(b, "lowpass", 3600), g = adsr(b, w, v, .003, 1.4, .12, d, .7, b.ch.keys), end = w + d + 1;
  lp.connect(g); osc(b, "triangle", f, w, end - w).connect(lp);
  [[2, .22], [3, .07]].forEach(([k, a]) => { const h = b.ctx.createGain(); h.gain.value = a; h.connect(lp); osc(b, "sine", f * k, w, end - w).connect(h); });
}
function bell(b, m, w, d, v) {                     // glockenspiel-ish
  const f = mtof(m), g = adsr(b, w, v, .002, .9, 0, d, .6, b.ch.bell);
  [[1, 1], [2.76, .32], [5.4, .1]].forEach(([k, a]) => { const h = b.ctx.createGain(); h.gain.value = a; h.connect(g); osc(b, "sine", f * k, w, d + 1).connect(h); });
}
function pluck(b, m, w, v, d = .3) {
  const lp = filt(b, "lowpass", 3000); lp.frequency.setValueAtTime(3400, w); lp.frequency.exponentialRampToValueAtTime(800, w + .3);
  lp.connect(env(b, w, v, .006, .38, b.ch.pluck));
  osc(b, "triangle", mtof(m), w, .45).connect(lp);
  const h = b.ctx.createGain(); h.gain.value = .22; h.connect(lp); osc(b, "sine", mtof(m) * 2, w, .45).connect(h);
}
function strings(b, ms, w, d, v, trem = 0) {
  const lp = filt(b, "lowpass", 2400), g = adsr(b, w, v, .45, .6, .85, d, .9, b.ch.str), end = w + d + 1.2;
  if (trem) { const tg = b.ctx.createGain(), l = osc(b, "sine", 8.5, w, end - w), ld = b.ctx.createGain(); tg.gain.value = 1 - trem / 2; ld.gain.value = trem / 2; l.connect(ld); ld.connect(tg.gain); lp.connect(tg); tg.connect(g); }
  else lp.connect(g);
  const vib = osc(b, "sine", 5.2, w, end - w), vd = b.ctx.createGain(); vd.gain.value = 5; vib.connect(vd);
  ms.forEach(m => [-9, 0, 9].forEach(c => { const o = osc(b, "sawtooth", mtof(m), w, end - w); o.detune.value = c; vd.connect(o.detune); o.connect(lp); }));
}
function sawpad(b, ms, w, d, v) {
  const lp = filt(b, "lowpass", 1800), g = adsr(b, w, v, .04, .4, .75, d, .25, b.ch.pad), end = w + d + .4; lp.connect(g);
  ms.forEach(m => [-7, 7].forEach(c => { const o = osc(b, "sawtooth", mtof(m), w, end - w); o.detune.value = c; o.connect(lp); }));
}
function stab(b, ms, w, v, d = .22) {             // brassy chord stab
  const lp = filt(b, "lowpass", 3200, 1.2); lp.frequency.setValueAtTime(3600, w); lp.frequency.exponentialRampToValueAtTime(900, w + .25);
  const g = adsr(b, w, v, .006, .2, .2, d, .12, b.ch.keys); lp.connect(g);
  ms.forEach(m => [-10, 10].forEach(c => { const o = osc(b, "sawtooth", mtof(m), w, d + .3); o.detune.value = c; o.connect(lp); }));
}
function lead(b, m, w, d, v) {
  const lp = filt(b, "lowpass", 2800), g = adsr(b, w, v, .012, .25, .7, d, .18, b.ch.lead), end = w + d + .3; lp.connect(g);
  const vib = osc(b, "sine", 5.5, w + .15, end - w - .15), vd = b.ctx.createGain(); vd.gain.value = 9; vib.connect(vd);

}
function bass(b, m, w, v, d = .3) {

    if (A && A.ctx.state === "running") { const ahead = t + .3; if (ahead > schedHead) { scheduleWindow(A, schedHead, ahead, base); schedHead = ahead; } }
  }
  frame();
  $("hud-scene").textContent = `Scene ${cur + 1}/${scenes.length} · ${scenes[cur]?.id}`;
  $("hud-time").textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  $("hud-prog").style.width = `${t / TOTAL * 100}%`;
  $("hud-audio").innerHTML = `♪ <b>${MIX.music ? "on" : "off"}</b> · sfx <b>${MIX.sfx ? "on" : "off"}</b> · voice <b>${MIX.narr ? "on" : "off"}</b>`;
  requestAnimationFrame(loop);
}

// =====================================================================================
// Export: the finished video (with sound), or the soundtrack alone
// =====================================================================================
let recorder = null;
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function exportVideo(withMic) {
  if (recorder || !A) return;
  if (!navigator.mediaDevices?.getDisplayMedia || !window.MediaRecorder) { alert("Video export needs Chrome. Use QuickTime + the soundtrack (A) instead."); return; }
  await setPlaying(false);
  const keepNarr = MIX.narr;
  let screen, mic, micSrc;
  try {
    screen = await navigator.mediaDevices.getDisplayMedia({video: {frameRate: 30, displaySurface: "browser"}, audio: false, preferCurrentTab: true, selfBrowserSurface: "include"});
    const [vt] = screen.getVideoTracks();
    if (window.CropTarget && vt.cropTo) await vt.cropTo(await CropTarget.fromElement(stage));
    if (withMic) {
      mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
      micSrc = A.ctx.createMediaStreamSource(mic); micSrc.connect(A.rec);
      MIX.narr = false; setLevels(A); document.body.classList.add("voice"); fit();
    }
  } catch (e) { screen?.getTracks().forEach(x => x.stop()); alert("Export cancelled: " + e.message); return; }
  $("hud").classList.add("hide"); $("start").classList.add("hide");
  const mime = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  const chunks = [];
  recorder = new MediaRecorder(new MediaStream([...screen.getVideoTracks(), ...A.rec.stream.getAudioTracks()]), {mimeType: mime, videoBitsPerSecond: 12e6});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    download(new Blob(chunks, {type: mime}), `data-viz-kit-explainer${withMic ? "-my-voice" : ""}.${mime.startsWith("video/mp4") ? "mp4" : "webm"}`);
    screen.getTracks().forEach(x => x.stop()); mic?.getTracks().forEach(x => x.stop()); micSrc?.disconnect();
    MIX.narr = keepNarr; setLevels(A); document.body.classList.remove("voice"); fit(); $("hud").classList.remove("hide"); recorder = null;
  };
  seek(0);
  for (const n of ["3", "2", "1"]) { $("count").firstElementChild.textContent = n; $("count").classList.remove("hide"); await new Promise(r => setTimeout(r, 800)); }
  $("count").classList.add("hide");
  await new Promise(r => setTimeout(r, 300));
  recorder.start(1000);
  await new Promise(r => setTimeout(r, 400));
  setPlaying(true);
}
function onEnd() { if (recorder) setTimeout(() => recorder?.state === "recording" && recorder.stop(), 2200); }
async function renderSoundtrack(sr = 44100) {
  const ctx = new OfflineAudioContext(2, Math.ceil((TOTAL + 2.5) * sr), sr), b = makeBus(ctx, ctx.destination, false);
  scheduleWindow(b, 0, TOTAL + 2.5, 0);
  return ctx.startRendering();
}
async function exportSoundtrack() {
  const buf = await renderSoundtrack(), sr = buf.sampleRate, n = buf.length;
  const data = new DataView(new ArrayBuffer(44 + n * 4)), w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); data.setUint32(4, 36 + n * 4, true); w(8, "WAVEfmt "); data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 2, true);
  data.setUint32(24, sr, true); data.setUint32(28, sr * 4, true); data.setUint16(32, 4, true); data.setUint16(34, 16, true); w(36, "data"); data.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { data.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); data.setInt16(46 + i * 4, Math.max(-1, Math.min(1, Rr[i])) * 32767, true); }
  download(new Blob([data], {type: "audio/wav"}), `data-viz-kit-soundtrack${MIX.narr ? "" : "-no-voice"}.wav`);
}
addEventListener("keydown", e => {
  if (recorder) return;
  const k = e.key.toLowerCase();
  if (e.code === "Space") { e.preventDefault(); if (!playing && t >= TOTAL - .01) seek(0); setPlaying(!playing); }
  else if (e.code === "ArrowRight") seek(starts[Math.min(cur + 1, scenes.length - 1)]);
  else if (e.code === "ArrowLeft") seek(t - starts[cur] > 1 ? starts[cur] : starts[Math.max(cur - 1, 0)]);
  else if (k === "r") { seek(0); setPlaying(true); }
  else if (k === "h") { $("hud").classList.toggle("hide"); $("start").classList.add("hide"); }
  else if (k === "m" || k === "s" || k === "n") { const key = {m: "music", s: "sfx", n: "narr"}[k]; MIX[key] = !MIX[key]; if (A) setLevels(A); }
  else if (k === "p") { document.body.classList.toggle("voice"); fit(); }
  else if (k === "e") exportVideo(false);
  else if (k === "v") exportVideo(true);
  else if (k === "a") exportSoundtrack();
});

// URL options: ?t=42 (hold a still), ?scene=7 or ?scene=s-agent, ?only=s-agent (one scene), ?hud=0, ?selftest=1
(async () => {
  try { const ctx = new AudioContext(); A = makeBus(ctx, ctx.destination, true); await decodeNarration(ctx); } catch (e) { console.warn("audio unavailable", e); }
  await document.fonts.ready;
  layout();
  $("status").textContent = `narration:${Object.keys(NBUF).length} total:${TOTAL.toFixed(1)} events:${EVENTS.length} starts:${scenes.map((s, i) => s.id + "@" + starts[i].toFixed(1)).join(",")}`;
  if (q.has("selftest")) {
    try {
      const sr = +q.get("selftest") > 1000 ? +q.get("selftest") : 22050, buf = await renderSoundtrack(sr), L = buf.getChannelData(0);
      let peak = 0; for (const v of L) peak = Math.max(peak, Math.abs(v));
      const rms = (a, z) => { let s2 = 0, n = 0; for (let i = Math.floor(a * sr); i < Math.min(L.length, z * sr); i++) { s2 += L[i] * L[i]; n++; } return Math.sqrt(s2 / Math.max(n, 1)).toFixed(3); };
      const msg = "SELFTEST peak:" + peak.toFixed(2) + " " + scenes.map((sc, i) => `${sc.id}:${rms(starts[i], starts[i] + durs[i])}`).join(" ");
      console.log(msg); $("status").textContent = msg;
    } catch (e) { console.log("SELFTEST error " + e); $("status").textContent = "SELFTEST error " + e; }
    return;
  }
  if (q.has("dumpaudio")) {   // for analysis: the rendered soundtrack as base64 16-bit mono chunks on the console (v3/dump_audio.py)
    const sr = +q.get("dumpaudio") || 16000; if (q.get("mix") === "music") { MIX.narr = false; MIX.sfx = false; }
    const buf = await renderSoundtrack(sr), L = buf.getChannelData(0), R = buf.getChannelData(1), i16 = new Int16Array(L.length);
    for (let i = 0; i < L.length; i++) i16[i] = Math.max(-1, Math.min(1, (L[i] + R[i]) / 2)) * 32767;
    const u8 = new Uint8Array(i16.buffer), CH = 48000, n = Math.ceil(u8.length / CH);
    for (let j = 0; j < n; j++) { let bin = ""; const part = u8.subarray(j * CH, (j + 1) * CH); for (let i = 0; i < part.length; i++) bin += String.fromCharCode(part[i]); console.log(`AUDIO ${j}/${n} ${sr} ${btoa(bin)}`); }
    console.log("AUDIO END " + scenes.map((sc, i) => sc.id + "@" + starts[i].toFixed(2)).join(",") + " SECS " + SECS.map(x => x[1] + "@" + x[0].toFixed(2)).join(","));
    return;
  }
  if (q.get("hud") === "0") { $("hud").classList.add("hide"); $("start").classList.add("hide"); }
  const sc = q.get("scene"), scIdx = sc == null ? 0 : isNaN(+sc) ? Math.max(0, scenes.findIndex(s => s.id === sc)) : Math.max(0, +sc - 1);
  if (q.has("t")) { stage.classList.add("still"); $("start").classList.add("hide"); seek(+q.get("t") + (sc != null ? starts[scIdx] : 0)); }
  else seek(starts[scIdx] || 0);
  requestAnimationFrame(loop);
})();
</script>
