<script>
(() => {
  // a twin-bell alarm clock; hands are driven by frame(u)
  const ticks = Array.from({length: 60}, (_, i) => {
    const a = i * 6 * Math.PI / 180, r0 = i % 5 ? 196 : 180, w = i % 5 ? 3 : 8;
    return `<line x1="${300 + r0 * Math.sin(a)}" y1="${380 - r0 * Math.cos(a)}" x2="${300 + 212 * Math.sin(a)}" y2="${380 - 212 * Math.cos(a)}" stroke="#143359" stroke-width="${w}" stroke-linecap="round"/>`;
  }).join("");
  const nums = [[12, 0], [3, 90], [6, 180], [9, 270]].map(([n, d]) => {
    const a = d * Math.PI / 180; return `<text x="${300 + 140 * Math.sin(a)}" y="${380 - 140 * Math.cos(a) + 24}" text-anchor="middle" font-family="LF" font-weight="700" font-size="68" fill="#143359">${n}</text>`;
  }).join("");
  const CLOCK = `<svg viewBox="0 0 600 680">
    <path d="M170 600 L120 670 M430 600 L480 670" stroke="#143359" stroke-width="26" stroke-linecap="round"/>
    <g fill="#D9F14E" stroke="#143359" stroke-width="12"><path d="M70 170 A95 95 0 0 1 220 60 Z" transform="rotate(-8 150 120)"/><path d="M380 60 A95 95 0 0 1 530 170 Z" transform="rotate(8 450 120)"/></g>
    <path d="M300 128 L300 96" stroke="#143359" stroke-width="16" stroke-linecap="round"/><circle cx="300" cy="86" r="18" fill="#143359"/>
    <circle cx="300" cy="380" r="250" fill="#143359"/><circle cx="300" cy="380" r="224" fill="#fff"/>
    ${ticks}${nums}
    <g class="so-hh"><rect x="289" y="250" width="22" height="146" rx="11" fill="#143359"/></g>
    <g class="so-mh"><rect x="293" y="185" width="14" height="211" rx="7" fill="#DA2103"/></g>
    <circle cx="300" cy="380" r="20" fill="#D9F14E" stroke="#143359" stroke-width="6"/></svg>`;
  document.querySelectorAll("#s-out .so-ring, #s-out .so-rwc").forEach(e => { e.innerHTML = CLOCK; });

  const C = [.3, 1.75, 5.22, 7.94];
  const R0 = 8.9, R1 = 11.85;                       // the rewind
  const io = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
  const clamp = x => Math.max(0, Math.min(1, x));
  // story minutes (continuous) as a function of u
  const mins = u => u < C[0] ? H(14, 45) + 7 * clamp(u / C[0]) ** 2
                  : u < R0 ? H(14, 52)
                  : H(14, 52) - 45 * io(clamp((u - R0) / (R1 - R0)));

  SCENES["s-out"] = {
    narrAt: .3,
    music: [[C[3], "hush"]],
    sam: [[0, {x: 1470, y: 534, s: 1.3, mood: "stressed", pose: "rest", props: [], snap: true}],
          [.05, {snap: false}],
          [C[1], {pose: "cheeks"}],
          [4.04, {pose: "rest"}],
          [5.05, {x: 805, y: 250, s: 2.3, pose: "coffee", props: ["coffee"], mood: "deadpan"}],
          // the rewind: back through the day's poses, reversing to the desk
          [9.0, {x: 1300, y: 534, s: 1.3, pose: "cheeks", props: [], mood: "stressed"}],
          [9.4, {x: 1000, y: 600, s: 1.15, pose: "rest", mood: "deadpan"}],
          [9.8, {x: 720, y: 655, s: 1, pose: "type", props: ["laptop"], mood: "stressed"}],
          [10.2, {x: 470, pose: "rest", props: [], mood: "focus"}],
          [10.6, {x: 260, pose: "point", mood: "focus"}],
          [11.15, {x: 70, pose: "coffee", props: ["coffee"], mood: "happy"}]],
    clock: u => {
      const m = Math.round(mins(u));
      return {m, alarm: u >= C[0] && m >= H(14, 50)};
    },
    sfx: [[0, "ticktock", {dur: .3}], [.3, "stamp"], [.42, "blip"], [.58, "blip"], [.74, "blip"], [.9, "blip"], [1.2, "blip"], [1.36, "blip"],
          [1.76, "pop"], [2.98, "pop"], [4.04, "stamp"], [5.0, "whoosh"], [6.32, "trombone"],
          [C[3], "tapestop"], [R0, "rewind", {dur: R1 - R0}], [R1, "sparkle"]],
    frame(u) {
      const root = document.getElementById("s-out"); if (!root) return;
      root.classList.toggle("so-cold", u < 11.05);    // steam comes back as the tape reaches the morning
      const m = mins(u);
      const show = u < 5.3 ? mins(Math.min(u, R0)) : m;
      root.querySelectorAll(".so-hh").forEach(g => g.setAttribute("transform", `rotate(${(show / 60) * 30} 300 380)`));
      root.querySelectorAll(".so-mh").forEach(g => g.setAttribute("transform", `rotate(${show * 6} 300 380)`));
    },
  };
})();
</script>
