[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mckviz"
version = "0.1.0"
description = "McKesson data-visualization theme and helpers for matplotlib and Plotly"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
plotly = ["plotly>=5.20"]
examples = ["plotly>=5.20", "pandas>=2.0", "numpy>=1.26"]
dev = ["pytest>=8", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mckviz*"]

[tool.setuptools.package-data]
mckviz = ["_tokens.json", "mckviz.mplstyle", "plotly_template.json"]
